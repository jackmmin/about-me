name: Supabase keepalive

# Supabase 무료 플랜은 7일간 요청이 없으면 프로젝트를 일시정지한다.
# 5일마다(매월 1·6·11·16·21·26·31일, 00:00 UTC = 09:00 KST) ping()을 호출해 깨워 둔다.
on:
  schedule:
    - cron: '0 0 */5 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o response.txt -w '%{http_code}' -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $status: $(cat response.txt)"
          # 실패하면 워크플로가 실패로 표시되어 GitHub 알림 메일이 온다.
          [ "$status" = "200" ]

      # 공개 저장소는 60일간 활동이 없으면 예약 워크플로가 자동으로 꺼진다.
      # 커밋 없이 이 워크플로를 다시 활성화해 비활성 타이머를 초기화한다.
      - name: Keep this workflow enabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
